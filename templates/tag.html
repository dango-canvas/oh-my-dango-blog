<%- include('_header.html', { pageTitle: '标签: ' + tag, site: site }) %>
<div class="card">
<h1>标签: #<%= tag %></h1>
<hr>
<ul class="post-list">
    <% posts.forEach(function(post){ %>
        <li>
            <a href="<%= post.slug %>.html"><%= post.title %></a>
            <span class="meta">(<%= post.date %>)</span>
        </li>
    <% }) %>
</ul>
</div>
<%- include('_footer.html', { site: site }) %>
